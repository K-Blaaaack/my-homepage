# 首页文案（原 layouts/partials/*.html 里的硬编码中文，契约 §3.6）
# 模板只负责结构与类名，文案一律从这里取。

[hero]
prefix = "PERSONAL PAGE://"
title = "K-BLACK"
cta = "READ MORE"
scroll = "SCROLL"

[news]
badge = "BREAKING NEWS"
post_tag = "文章"
